[project]
name = "sentinel-ai"
version = "0.1.0"
description = "SentinelAI - autonomous data quality, root cause investigation and interactive data copilot platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SentinelAI Platform Team" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.50",
    "plotly>=5.20",
    "pandas>=2.1",
    "pydantic>=2.6",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
exclude = []
